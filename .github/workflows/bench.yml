# Worker CPU benchmark (P3-10). Runs the hot paths in workerd (local D1, mocked NerdGraph), prints the table to the job
# summary and fails on a clear regression against apps/worker/bench/baseline.json (ratios to a calibration job, so a
# slow runner is not a regression). Not a required check. To keep Actions minutes low it runs only for pull requests that
# touch code on the Worker's path, weekly, and on demand; it never deploys and uses no secrets.
name: Worker CPU benchmark

on:
  pull_request:
    paths:
      - 'apps/worker/**'
      - 'packages/core/**'
      - 'packages/auth/**'
      - 'packages/http-app/**'
      - 'packages/storage/**'
      - 'scripts/bench-cpu.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/bench.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Worker CPU benchmark
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64"]') }}
    # workerd needs glibc 2.35+, newer than a fresh self-hosted runner's userland: run in a Debian 12 container.
    container: node:24-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-node comes first: pnpm/action-setup runs on the node on PATH, which is too old on a fresh runner. No
      # `cache: pnpm` (it needs pnpm already installed).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Benchmark
        run: pnpm bench:cpu
