# Worker CPU benchmark (P3-10). Runs the hot paths in workerd (local D1, mocked NerdGraph), prints the table to the job
# summary and fails on a clear regression against apps/worker/bench/baseline.json (ratios to a calibration job, so a
# slow runner is not a regression). Not a required check. To keep Actions minutes low it runs only for pull requests that
# touch code on the Worker's path, weekly, and on demand; it never deploys and uses no secrets.
name: Worker CPU benchmark

on:
  pull_request:
    paths:
      - 'apps/worker/**'
      - 'packages/core/**'
      - 'packages/auth/**'
      - 'packages/http-app/**'
      - 'packages/storage/**'
      - 'scripts/bench-cpu.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/bench.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Worker CPU benchmark
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64"]') }}
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # workerd needs glibc 2.35+, newer than a fresh self-hosted runner's userland: run it in a Debian 12 container.
      - name: Benchmark
        run: scripts/ci-container.sh bench:cpu
