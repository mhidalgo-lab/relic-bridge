# Docker image (P2-11). Actions are pinned by commit SHA; Renovate keeps them updated.
#
# Pull requests: build the image (amd64 + arm64) without pushing, scan both architectures with Trivy (fails on fixed
# high/critical findings) and smoke-test the amd64 image (hardened `docker run`, `serve` starts, an operator creates a
# project and a token with the CLI, MCP `tools/list` answers). Nothing is pushed or signed.
#
# Release: runs after the `Release` workflow succeeded on `main` or a `release/x.y` backport branch (P8-68; GITHUB_TOKEN events cannot trigger workflows, so the
# GitHub Release created there cannot start this one directly). `plan` proceeds only when the repository variable
# RB_RELEASE_ENABLED is 'true' and `v<version>` is a published GitHub Release whose tag points at this commit.
# `build` (read-only token, no OIDC, no registry credentials) builds and scans the multi-arch image and uploads it as an
# OCI archive. `publish` (protected `release` environment: a reviewer approves) never checks out the repository or runs
# project code: it verifies the archive's checksum, pushes it to GHCR with skopeo (digests preserved), creates the SBOM
# (syft), signs the image keylessly (cosign, GitHub OIDC) and attests provenance and the SBOM.
# Safety rails: THREAT_MODEL T18; scripts/test/docker-workflow.test.ts asserts the structure.
name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - apps/cli/**
      - packages/**
      - deploy/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - scripts/docker-smoke.sh
      - scripts/docker-smoke/**
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main, 'release/*']

permissions: {}

concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_IMAGE_NAME: relic-bridge

jobs:
  plan:
    name: Plan
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
      startsWith(github.event.workflow_run.head_branch, 'release/')) && vars.RB_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - id: plan
        name: Is there a published GitHub Release for this commit?
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha"; exit 1; }
          # Read the version through the contents API instead of checking out the workflow_run commit: this job never
          # fetches or executes the triggering commit's files (THREAT_MODEL T18, OpenSSF Dangerous-Workflow).
          version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/apps/cli/package.json?ref=${HEAD_SHA}" --jq .content |
            base64 -d | jq -r .version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          none() { echo "$1"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }
          rel="$(gh release view "v${version}" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease 2>/dev/null)" ||
            none "no GitHub Release v${version}: nothing to publish"
          [[ "$(jq -r .isDraft <<<"$rel")" == false ]] || none "release v${version} is a draft"
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}")"
          for _ in 1 2 3 4 5; do
            type="$(jq -r .object.type <<<"$ref")"; sha="$(jq -r .object.sha <<<"$ref")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected tag data"; exit 1; }
            [[ "$type" == tag ]] || break
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '{object: .object}')"
          done
          [[ "$type" == commit && "$sha" == "$HEAD_SHA" ]] || none "tag v${version} is not this commit: nothing to publish"
          # `:latest` moves only for the highest stable release: a re-run for an older tag (or a delayed workflow_run)
          # must never roll it back. Prereleases and backports (release/x.y, P8-68) never move it.
          latest=false
          if [[ "$HEAD_BRANCH" == main && "$(jq -r .isPrerelease <<<"$rel")" == false ]]; then
            highest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
              --json tagName --jq '.[].tagName' | sed -n 's/^v\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' |
              sort -V | tail -n1)"
            top="$(printf '%s\n%s\n' "${highest:-0.0.0}" "$version" | sort -V | tail -n1)"
            if [[ "$top" == "$version" ]]; then latest=true; fi
          fi
          {
            echo "release=true"
            echo "version=${version}"
            echo "sha=${HEAD_SHA}"
            echo "latest=${latest}"
          } >> "$GITHUB_OUTPUT"

  # Pull requests and releases. Runs dependency and project code (the Dockerfile installs and builds): no OIDC token, no
  # registry credentials, read-only repository token.
  build:
    name: Build, scan and smoke-test the image
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.plan.outputs.release == 'true') }}
    # GitHub-hosted runners only (P8-64).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-sha256: ${{ steps.archive.outputs.archive-sha256 }}
    env:
      RELEASE: ${{ needs.plan.outputs.release == 'true' }}
      VERSION: ${{ needs.plan.outputs.version || '0.0.0-ci' }}
      REVISION: ${{ needs.plan.outputs.sha || github.sha }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, loaded for the scan and smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: relic-bridge:scan
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.REVISION }}
          # No cache import/export in release builds: a poisoned cache must not reach the published image.
          cache-from: ${{ env.RELEASE != 'true' && 'type=gha' || '' }}
          cache-to: ${{ env.RELEASE != 'true' && 'type=gha,mode=max' || '' }}
      - name: Trivy scan, linux/amd64 (high and critical, fixed vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: relic-bridge:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret
          hide-progress: true
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
      - name: Smoke test (hardened run, CLI setup, MCP tools/list)
        run: scripts/docker-smoke.sh relic-bridge:scan
      # The arm64 image is cross-built (no emulation: the runtime stage only copies files) into a docker archive and
      # scanned like the amd64 one: its distroless base layers differ per architecture. For releases this is a second
      # build of the same Dockerfile and inputs, scanned before the multi-arch archive below is created.
      - name: Build (linux/arm64) into an archive for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          sbom: false
          outputs: type=docker,dest=${{ runner.temp }}/relic-bridge-arm64.tar
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.REVISION }}
          cache-from: ${{ env.RELEASE != 'true' && 'type=gha' || '' }}
      - name: Trivy scan, linux/arm64 (high and critical, fixed vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/relic-bridge-arm64.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret
          hide-progress: true
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
      - name: Build the release archive (linux/amd64 + linux/arm64, OCI layout)
        if: env.RELEASE == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/relic-bridge-oci.tar
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.REVISION }}
      - id: archive
        name: Checksum the release archive
        if: env.RELEASE == 'true'
        run: |
          mkdir release-image
          mv "$RUNNER_TEMP/relic-bridge-oci.tar" release-image/relic-bridge-oci.tar
          echo "archive-sha256=$(sha256sum release-image/relic-bridge-oci.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: upload
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ env.VERSION }}
          path: release-image/relic-bridge-oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Holds the OIDC token and the registry credentials. No checkout, no install, no project scripts: only the artifact,
  # skopeo, docker login, syft, cosign and the attest action. Keep it that way.
  publish:
    name: Publish to GHCR, sign and attest
    needs: [plan, build]
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.head_branch == 'main' ||
      startsWith(github.event.workflow_run.head_branch, 'release/')) &&
      vars.RB_RELEASE_ENABLED == 'true' && needs.plan.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/pkgs/container/relic-bridge
    permissions:
      contents: read
      packages: write # push the image and its attestations to GHCR
      id-token: write # cosign keyless signing, Sigstore attestations
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      LATEST: ${{ needs.plan.outputs.latest }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check the inputs
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          [[ "$LATEST" == true || "$LATEST" == false ]] || { echo "::error::bad latest flag"; exit 1; }
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::bad artifact id"; exit 1; }
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad checksum digest"; exit 1; }
      # Downloads by id from this run; the action fails on an artifact digest mismatch.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: image
      - name: Verify the archive checksum
        run: echo "${ARCHIVE_SHA256}  image/relic-bridge-oci.tar" | sha256sum -c --strict -
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        name: Push the image (digest preserved; an existing tag must hold the same image)
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$repo" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+$ ]] || { echo "::error::bad repository name"; exit 1; }
          built="sha256:$(skopeo inspect --raw oci-archive:image/relic-bridge-oci.tar | sha256sum | cut -d' ' -f1)"
          if remote="$(skopeo inspect --raw --authfile "$HOME/.docker/config.json" "docker://${repo}:${VERSION}" 2>/dev/null)"; then
            [[ "sha256:$(printf '%s' "$remote" | sha256sum | cut -d' ' -f1)" == "$built" ]] || {
              echo "::error::${repo}:${VERSION} already exists with a different image; tags are immutable"; exit 1
            }
            echo "${repo}:${VERSION} is already pushed with this image; continuing with signing"
          else
            skopeo copy --all --preserve-digests --dest-authfile "$HOME/.docker/config.json" \
              "oci-archive:image/relic-bridge-oci.tar" "docker://${repo}:${VERSION}"
          fi
          # Only the highest stable release moves :latest (decided in `plan`; it is never moved backwards).
          if [[ "$LATEST" == true ]]; then
            skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
              "docker://${repo}@${built}" "docker://${repo}:latest"
          fi
          {
            echo "repo=${repo}"
            echo "digest=${built}"
          } >> "$GITHUB_OUTPUT"
      - name: SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: relic-bridge-${{ env.VERSION }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (cosign keyless; signs the digest, never a tag)
        env:
          IMAGE: ${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Attach the SBOM (cosign attestation)
        env:
          IMAGE: ${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate "relic-bridge-${VERSION}.cdx.json" "$IMAGE"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify what was just published
        env:
          IMAGE: ${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker.yml@refs/heads/main" \
            > /dev/null
