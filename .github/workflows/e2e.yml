# Admin panel in a real browser (P4-11). Manual only: Chromium download and run cost Actions minutes, so it is never
# triggered by pull requests or pushes. Run it before a release or after changing admin-ui / sign-in / headers, or run
# `pnpm test:e2e` locally. Uses no secrets and never deploys; the identity provider and NerdGraph are loopback mocks.
name: Admin browser E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
