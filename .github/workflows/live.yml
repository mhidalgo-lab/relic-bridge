# Optional live suite (P1-12). Manual only: never runs on pull requests, so fork PRs cannot reach the secrets.
# The `live` environment (with required reviewers) holds RB_LIVE_API_KEY and RB_LIVE_ACCOUNT_ID.
name: Live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live NerdGraph (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
        env:
          RB_LIVE_API_KEY: ${{ secrets.RB_LIVE_API_KEY }}
          RB_LIVE_ACCOUNT_ID: ${{ secrets.RB_LIVE_ACCOUNT_ID }}
          RB_LIVE_REGION: ${{ vars.RB_LIVE_REGION }}
