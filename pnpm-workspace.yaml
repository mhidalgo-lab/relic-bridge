packages:
  - packages/*
  - apps/*
  - site

# Supply-chain hardening (THREAT_MODEL T18). pnpm 11+ defaults are already safe; we tighten them.
# Don't resolve versions published less than 3 days ago (minutes).
minimumReleaseAge: 4320
# Fail if a package is published with weaker auth (e.g. lost provenance) than a previous version.
trustPolicy: no-downgrade
# Transitive deps may not use git/tarball URLs.
blockExoticSubdeps: true
# Install scripts run only for packages explicitly approved here.
strictDepBuilds: true
allowBuilds:
  lefthook: true
  esbuild: true
  workerd: true
strictPeerDependencies: true

# drizzle-kit 0.31 pulls esbuild 0.18 through the deprecated @esbuild-kit loader (GHSA-67mh-4wv8-2f99, dev server
# only). Pin it to the patched line we already use; drizzle-kit only calls its transform API.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  # Dev-only advisories (THREAT_MODEL T18, P8-10). Pinned to the first patched release until the parents catch up.
  # miniflare (wrangler, @cloudflare/vitest-plugin) pins sharp 0.35.4; no miniflare release pins >= 0.35.5 yet
  # (GHSA-wq5f-xc86-pv6w, librsvg). sharp is not in any shipped artifact.
  sharp: 0.35.5
  # @changesets/cli > launch-editor (GHSA-pqg4-j6r4-53mv).
  shell-quote: 1.11.0
  # vite/postcss/jsdom/css-tree (GHSA-68fv-2mgg-jv7q).
  source-map-js: 1.2.2
